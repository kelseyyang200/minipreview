<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniPreview - 视频审片协作</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0e14;
            --bg-secondary: #1a1f28;
            --bg-tertiary: #252b36;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --text-muted: #6e7681;
            --accent: #00d4aa;
            --accent-hover: #00f5c4;
            --warning: #ff6b6b;
            --border: #30363d;
            --shadow: rgba(0, 0, 0, 0.4);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        /* 顶部工具栏 */
        .toolbar {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            height: 60px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent) 0%, #0099ff 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            box-shadow: 0 2px 8px rgba(0, 212, 170, 0.3);
        }

        .logo-text {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .logo-text .mini {
            background: linear-gradient(135deg, var(--accent) 0%, #0099ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-text .preview {
            color: var(--text-primary);
        }

        .video-url-input {
            flex: 1;
            display: flex;
            gap: 10px;
        }

        .video-url-input input {
            flex: 1;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 14px;
            color: var(--text-primary);
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .video-url-input input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            background: var(--bg-secondary);
            border-color: var(--accent);
        }

        .btn-primary {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        /* 主容器 */
        .main-container {
            display: flex;
            height: calc(100vh - 60px);
        }

        /* 视频区域 */
        .video-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
        }

        .video-wrapper {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            margin: 20px;
            border-radius: 8px;
            overflow: hidden;
        }

        #videoPlayer {
            max-width: 100%;
            max-height: 100%;
            outline: none;
        }

        .upload-hint {
            text-align: center;
            color: var(--text-secondary);
            padding: 60px;
        }

        .upload-hint-icon {
            font-size: 48px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        /* 时间轴区域 */
        .timeline-section {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            padding: 8px 20px;
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .timeline-time {
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 11px;
            color: var(--text-secondary);
        }

        .timeline-time span {
            color: var(--text-primary);
            font-weight: 600;
        }

        .timeline-container {
            position: relative;
            height: 40px;
            background: var(--bg-tertiary);
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
        }

        .timeline-progress {
            height: 100%;
            background: linear-gradient(90deg, var(--accent) 0%, rgba(0, 212, 170, 0.2) 100%);
            width: 0%;
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .timeline-playhead {
            position: absolute;
            top: 0;
            width: 2px;
            height: 100%;
            background: #ffffff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.9), 0 0 20px rgba(255, 255, 255, 0.5);
            pointer-events: none;
            z-index: 10;
            left: 0%;
            transition: left 0.1s linear;
        }

        .timeline-preview-head {
            position: absolute;
            top: 0;
            width: 3px;
            height: 100%;
            background: #0066CC;
            box-shadow: 0 0 10px rgba(0, 102, 204, 0.9), 0 0 20px rgba(0, 102, 204, 0.5);
            pointer-events: none;
            z-index: 11;
            left: 0%;
            display: none;
        }

        .timeline-preview-time {
            position: absolute;
            top: -30px;
            background: rgba(0, 102, 204, 0.95);
            border: 1px solid #0066CC;
            border-radius: 4px;
            padding: 4px 10px;
            font-size: 13px;
            color: #ffffff;
            font-family: monospace;
            pointer-events: none;
            z-index: 12;
            display: none;
            transform: translateX(-50%);
            white-space: nowrap;
        }

        .timeline-markers {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .marker {
            position: absolute;
            top: 8px;
            width: 4px;
            height: 44px;
            background: var(--warning);
            border-radius: 2px;
            cursor: pointer;
            pointer-events: all;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 0 0 rgba(255, 107, 107, 0);
        }

        .marker:hover {
            transform: scale(1.3);
            box-shadow: 0 0 12px rgba(255, 107, 107, 0.6);
        }

        .marker.active {
            background: var(--accent);
            box-shadow: 0 0 12px rgba(0, 212, 170, 0.6);
        }

        .timeline-playhead {
            position: absolute;
            top: 0;
            width: 2px;
            height: 100%;
            background: var(--text-primary);
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
            pointer-events: none;
            z-index: 10;
        }

        .timeline-tooltip {
            position: absolute;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 12px;
            max-width: 200px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 20;
            box-shadow: 0 4px 12px var(--shadow);
        }

        .marker:hover .timeline-tooltip {
            opacity: 1;
        }

        .marker-tooltip-title {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .marker-tooltip-preview {
            color: var(--text-secondary);
            font-size: 11px;
            line-height: 1.4;
        }

        /* 控制栏 */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
        }

        .control-btn {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
        }

        .control-btn.active {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
        }

        .play-btn {
            width: 44px;
            height: 44px;
            font-size: 18px;
        }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: 12px;
        }

        .speed-label {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .speed-btns {
            display: flex;
            gap: 3px;
        }

        .speed-btn {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .speed-btn:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }

        .speed-btn.active {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
        }

        .add-marker-btn {
            margin-left: 20px;
            background: var(--warning);
            color: white;
            border-color: var(--warning);
        }

        .add-marker-btn:hover {
            background: #ff5252;
            border-color: #ff5252;
        }

        /* 批注面板 */
        .annotation-panel {
            width: 360px;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-title {
            font-size: 16px;
            font-weight: 600;
        }

        .marker-count {
            background: var(--bg-tertiary);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .annotations-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .annotation-item {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .annotation-item:hover {
            border-color: var(--accent);
            transform: translateX(-4px);
        }

        .annotation-item.active {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px var(--accent);
        }

        .annotation-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .annotation-time {
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 12px;
            color: var(--accent);
            font-weight: 600;
        }

        .annotation-actions {
            display: flex;
            gap: 8px;
        }

        .annotation-action {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            font-size: 14px;
            transition: color 0.2s;
        }

        .annotation-action:hover {
            color: var(--text-primary);
        }

        .annotation-action.delete:hover {
            color: var(--warning);
        }

        .annotation-content {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-primary);
        }

        .annotation-content.editing {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 8px;
            outline: none;
            min-height: 60px;
            width: 100%;
            color: var(--text-primary);
            font-family: inherit;
            font-size: inherit;
            line-height: inherit;
        }

        .annotation-content.editing:focus {
            border-color: var(--accent);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 32px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        /* 快捷键提示 */
        /* 分享模态框 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 8px 32px var(--shadow);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .modal-close:hover {
            color: var(--text-primary);
        }

        .share-url-display {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 12px;
            color: var(--text-primary);
            word-break: break-all;
            margin-bottom: 16px;
            max-height: 120px;
            overflow-y: auto;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-tertiary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* 文件上传隐藏 */
        #fileInput {
            display: none;
        }
        
        /* 快捷键提示 */
        .shortcut-tip {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 4px 8px;
            margin-left: 12px;
            padding: 6px 10px;
            background: rgba(26, 31, 40, 0.5);
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 10px;
            color: var(--text-secondary);
            opacity: 0.7;
        }
        
        .shortcut-tip:hover {
            opacity: 1;
        }
        
        .shortcut-tip kbd {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 2px;
            padding: 1px 3px;
            font-size: 9px;
            color: var(--text-primary);
            margin-right: 3px;
        }

        /* 右键菜单 */
        .context-menu {
            position: fixed;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 0;
            min-width: 160px;
            box-shadow: 0 4px 16px var(--shadow);
            z-index: 1000;
            display: none;
        }

        .context-menu-item {
            padding: 8px 16px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .context-menu-item:hover {
            background: var(--bg-tertiary);
        }

        .context-menu-item.danger {
            color: var(--warning);
        }

        .context-menu-item.danger:hover {
            background: rgba(255, 107, 107, 0.1);
        }

        .context-menu-divider {
            height: 1px;
            background: var(--border);
            margin: 4px 0;
        }
    </style>
</head>
<body>
    <!-- 顶部工具栏 -->
    <div class="toolbar">
        <div class="logo">
            <div class="logo-icon">▶</div>
            <div class="logo-text"><span class="mini">Mini</span><span class="preview">Preview</span></div>
        </div>
        <div class="video-url-input">
            <input type="text" id="videoUrlInput" placeholder="粘贴视频链接或选择本地文件..." onkeypress="handleUrlKeyPress(event)" />
            <button class="btn" onclick="loadVideoFromUrl()">加载</button>
            <button class="btn" onclick="document.getElementById('fileInput').click()">本地文件</button>
            <input type="file" id="fileInput" accept="video/*" multiple onchange="loadLocalFiles(event)" />
            <button class="btn" id="addVideoBtn" style="display: none;" onclick="document.getElementById('addFileInput').click()">➕ 添加视频</button>
            <input type="file" id="addFileInput" accept="video/*" multiple onchange="addMoreVideos(event)" style="display: none;" />
        </div>
        <div id="statusHint" style="font-size: 12px; color: var(--text-muted); margin-right: 12px;"></div>
        
        <!-- 导出批注下拉菜单 -->
        <div style="position: relative;">
            <button class="btn" onclick="toggleExportMenu()">📋 导出批注 ▼</button>
            <div id="exportMenu" style="display: none; position: absolute; top: 100%; right: 0; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 6px; margin-top: 4px; min-width: 140px; z-index: 100;">
                <button onclick="exportAsText()" style="width: 100%; padding: 10px 16px; background: none; border: none; color: var(--text-primary); text-align: left; cursor: pointer; font-size: 14px;">📝 文本格式</button>
                <div style="height: 1px; background: var(--border);"></div>
                <button onclick="exportAsImage()" style="width: 100%; padding: 10px 16px; background: none; border: none; color: var(--text-primary); text-align: left; cursor: pointer; font-size: 14px;">🖼️ 图片格式</button>
            </div>
        </div>
        
        <button class="btn btn-primary" onclick="shareAnnotations()">📤 分享批注</button>
    </div>

    <!-- 主容器 -->
    <div class="main-container">
        <!-- 视频区域 -->
        <div class="video-section">
            <div class="video-wrapper" id="videoWrapper" ondblclick="handleDoubleClickUpload()">
                <div id="uploadHint" class="upload-hint">
                    <div class="upload-hint-icon">🎥</div>
                    <p style="font-size: 16px; margin-bottom: 8px;">双击此处上传视频</p>
                    <p style="font-size: 12px; color: var(--text-muted);">或拖拽视频文件到这个区域</p>
                    <p style="font-size: 12px; color: var(--text-muted); margin-top: 12px;">支持在线链接：粘贴到顶部输入框</p>
                </div>
                <video id="videoPlayer" style="display: none;" onclick="togglePlay()"></video>
            </div>

            <!-- 时间轴 -->
            <div class="timeline-section">
                <div class="timeline-header">
                    <div class="timeline-time">
                        当前时间: <span id="currentTime">00:00:00</span>
                    </div>
                    <div class="timeline-time">
                        总时长: <span id="totalTime">00:00:00</span>
                    </div>
                </div>
                <div class="timeline-container" id="timeline" onclick="seekVideo(event)" ondblclick="addMarkerAtPosition(event)" onmousemove="showPreviewHead(event)" onmouseleave="hidePreviewHead()" oncontextmenu="showTimelineContextMenu(event)">
                    <div class="timeline-progress" id="timelineProgress"></div>
                    <div class="timeline-playhead" id="playhead"></div>
                    <div class="timeline-preview-head" id="previewHead"></div>
                    <div class="timeline-preview-time" id="previewTime">00:00:00</div>
                    <div class="timeline-markers" id="timelineMarkers"></div>
                </div>
            </div>

            <!-- 控制栏 -->
            <div class="controls">
                <button class="control-btn" onclick="skip(-5)" title="后退5秒">⏪</button>
                <button class="control-btn play-btn" id="playBtn" onclick="togglePlay()" title="播放/暂停">▶️</button>
                <button class="control-btn" onclick="skip(5)" title="前进5秒">⏩</button>
                
                <button class="control-btn" id="frameBtn" onclick="toggleFrameMode()" title="逐帧播放" style="margin-left: 20px;">🎞️</button>
                
                <div class="speed-control">
                    <span class="speed-label">速度:</span>
                    <div class="speed-btns">
                        <button class="speed-btn" onclick="setSpeed(0.5)">0.5x</button>
                        <button class="speed-btn" onclick="setSpeed(0.75)">0.75x</button>
                        <button class="speed-btn active" onclick="setSpeed(1)">1x</button>
                        <button class="speed-btn" onclick="setSpeed(1.25)">1.25x</button>
                        <button class="speed-btn" onclick="setSpeed(1.5)">1.5x</button>
                        <button class="speed-btn" onclick="setSpeed(2)">2x</button>
                    </div>
                </div>

                <button class="control-btn add-marker-btn" onclick="addMarkerAtCurrentTime()" title="添加标签 (M)">🏷️</button>
                
                <!-- 快捷键提示 -->
                <div class="shortcut-tip">
                    <div><kbd>M</kbd> 批注</div>
                    <div><kbd>Enter</kbd> 完成</div>
                    <div><kbd>Space</kbd> 播放</div>
                    <div><kbd>F</kbd> 逐帧</div>
                    <div><kbd>←</kbd><kbd>→</kbd> 前后</div>
                </div>
            </div>
        </div>

        <!-- 批注面板 -->
        <div class="annotation-panel">
            <div class="panel-header">
                <div class="panel-title">批注列表</div>
                <div class="marker-count" id="markerCount">0 个标签</div>
            </div>
            
            <!-- 手动添加批注 -->
            <div id="manualAddSection" style="display: none; padding: 12px; background: var(--bg-tertiary); border-bottom: 1px solid var(--border);">
                <div style="font-size: 12px; color: var(--text-secondary); margin-bottom: 8px;">📝 手动添加批注（微盘模式）</div>
                <div style="display: flex; gap: 8px; margin-bottom: 8px;">
                    <input type="text" id="manualTimeInput" placeholder="01:23:12" 
                        style="flex: 0 0 100px; background: var(--bg-primary); border: 1px solid var(--border); border-radius: 4px; padding: 6px 8px; color: var(--text-primary); font-size: 12px; font-family: monospace;">
                    <input type="text" id="manualContentInput" placeholder="输入批注内容..." 
                        style="flex: 1; background: var(--bg-primary); border: 1px solid var(--border); border-radius: 4px; padding: 6px 8px; color: var(--text-primary); font-size: 12px;"
                        onkeypress="if(event.key==='Enter'){event.preventDefault();addManualAnnotation();}">
                </div>
                <button class="btn btn-primary" onclick="addManualAnnotation()" style="width: 100%; font-size: 12px; padding: 6px;">添加批注</button>
            </div>
            
            <div class="annotations-list" id="annotationsList">
                <div class="empty-state">
                    <div class="empty-state-icon">📝</div>
                    <p>还没有批注<br>双击时间轴或按 M 添加标签</p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 分享模态框 -->
    <div class="modal-overlay" id="shareModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">📤 分享批注链接</div>
                <button class="modal-close" onclick="closeShareModal()">×</button>
            </div>
            <div class="share-url-display" id="shareUrl"></div>
            <div class="modal-actions">
                <button class="btn btn-primary" onclick="copyShareUrl()">📋 复制链接</button>
                <button class="btn" onclick="closeShareModal()">关闭</button>
            </div>
        </div>
    </div>

    <!-- 右键菜单 -->
    <div id="contextMenu" class="context-menu">
        <div class="context-menu-item" onclick="exportCurrentEpisodeImage()">
            🖼️ 导出本集图片批注
        </div>
        <div class="context-menu-divider"></div>
        <div class="context-menu-item danger" onclick="deleteCurrentEpisode()">
            🗑️ 删除本集
        </div>
    </div>

    <script>
        // 全局状态
        let video = document.getElementById('videoPlayer');
        let annotations = [];
        let currentSpeed = 1;
        let editingId = null;
        let videos = []; // 多视频列表 [{file, name, duration, startTime, element}]
        let currentVideoIndex = 0; // 当前播放的视频索引
        let totalDuration = 0; // 总时长
        let frameMode = false; // 逐帧播放模式
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            // 从URL加载批注数据
            loadAnnotationsFromUrl();
            
            // 设置键盘快捷键
            document.addEventListener('keydown', handleKeyboard);
            
            // 视频事件监听
            video.addEventListener('timeupdate', updateTimeline);
            video.addEventListener('loadedmetadata', () => {
                document.getElementById('totalTime').textContent = formatTime(video.duration);
            });
            video.addEventListener('play', () => {
                document.getElementById('playBtn').textContent = '⏸️';
            });
            video.addEventListener('pause', () => {
                document.getElementById('playBtn').textContent = '▶️';
            });
            video.addEventListener('ended', () => {
                playNextVideo();
            });
            
            // 设置拖拽上传
            setupDragAndDrop();
        });
        
        // 播放下一个视频
        function playNextVideo() {
            if (videos.length > 0 && currentVideoIndex < videos.length - 1) {
                currentVideoIndex++;
                loadVideoByIndex(currentVideoIndex);
                video.play();
            }
        }
        
        // 显示预览指示头
        function showPreviewHead(event) {
            const rect = event.currentTarget.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const percentage = Math.max(0, Math.min(1, x / rect.width));
            
            const previewHead = document.getElementById('previewHead');
            const previewTime = document.getElementById('previewTime');
            
            if (!previewHead || !previewTime) return;
            
            previewHead.style.display = 'block';
            previewHead.style.left = `${percentage * 100}%`;
            
            previewTime.style.display = 'block';
            previewTime.style.left = `${percentage * 100}%`;
            
            // 计算时间
            let time = 0;
            if (videos.length > 0 && totalDuration > 0) {
                // 多视频模式：找到对应的视频并显示本地时间
                const globalTime = percentage * totalDuration;
                
                // 找到对应的视频
                for (let i = 0; i < videos.length; i++) {
                    if (globalTime >= videos[i].startTime && 
                        (i === videos.length - 1 || globalTime < videos[i + 1].startTime)) {
                        time = globalTime - videos[i].startTime;
                        break;
                    }
                }
            } else if (video && video.duration) {
                time = percentage * video.duration;
            }
            
            previewTime.textContent = formatTime(time);
        }
        
        // 隐藏预览指示头
        function hidePreviewHead() {
            const previewHead = document.getElementById('previewHead');
            const previewTime = document.getElementById('previewTime');
            if (previewHead) previewHead.style.display = 'none';
            if (previewTime) previewTime.style.display = 'none';
        }

        // 回车键加载视频
        function handleUrlKeyPress(event) {
            if (event.key === 'Enter') {
                loadVideoFromUrl();
            }
        }
        
        // 切换导出菜单
        function toggleExportMenu() {
            const menu = document.getElementById('exportMenu');
            if (menu.style.display === 'none') {
                menu.style.display = 'block';
            } else {
                menu.style.display = 'none';
            }
        }
        
        // 点击其他地方关闭菜单
        document.addEventListener('click', (e) => {
            const menu = document.getElementById('exportMenu');
            if (menu && !e.target.closest('[onclick="toggleExportMenu()"]') && !e.target.closest('#exportMenu')) {
                menu.style.display = 'none';
            }
        });
        
        // 加载视频URL
        function loadVideoFromUrl() {
            const url = document.getElementById('videoUrlInput').value.trim();
            if (!url) {
                alert('请输入视频链接');
                return;
            }
            
            // 检测微盘链接 - 启用微盘模式
            if (url.includes('drive.weixin.qq.com') || url.includes('wshoto.com')) {
                enableWeDriveMode(url);
                return;
            }
            
            // 检测是否是视频文件链接
            const videoExtensions = ['.mp4', '.webm', '.ogg', '.mov', '.avi', '.mkv'];
            const isVideoFile = videoExtensions.some(ext => url.toLowerCase().includes(ext));
            
            if (!isVideoFile && url.startsWith('http')) {
                alert('⚠️ 链接格式问题：\n\n当前链接似乎不是直接的视频文件链接。\n\n需要的链接格式：以 .mp4、.webm 等视频格式结尾的直接播放链接。');
                return;
            }
            
            loadVideo(url);
        }
        
        // 启用微盘模式
        function enableWeDriveMode(wedriveUrl) {
            // 更新状态
            document.getElementById('statusHint').innerHTML = '📁 微盘模式 - 在新窗口观看';
            document.getElementById('statusHint').style.color = 'var(--accent)';
            
            // 保存微盘链接
            window.currentWeDriveUrl = wedriveUrl;
            
            // 显示手动添加区域和微盘链接
            document.getElementById('manualAddSection').style.display = 'block';
            document.getElementById('manualAddSection').innerHTML = `
                <div style="padding: 12px; background: var(--bg-tertiary); border-bottom: 1px solid var(--border);">
                    <div style="font-size: 12px; color: var(--text-secondary); margin-bottom: 8px;">📝 微盘批注模式</div>
                    <a href="${wedriveUrl}" target="_blank" class="btn btn-primary" style="width: 100%; margin-bottom: 8px; font-size: 12px; text-align: center;">🔗 在微盘观看视频</a>
                    <div style="display: flex; gap: 8px; margin-bottom: 8px;">
                        <input type="text" id="manualTimeInput" placeholder="01:23:12" 
                            style="flex: 0 0 100px; background: var(--bg-primary); border: 1px solid var(--border); border-radius: 4px; padding: 6px 8px; color: var(--text-primary); font-size: 12px; font-family: monospace;">
                        <input type="text" id="manualContentInput" placeholder="输入批注内容..." 
                            style="flex: 1; background: var(--bg-primary); border: 1px solid var(--border); border-radius: 4px; padding: 6px 8px; color: var(--text-primary); font-size: 12px;"
                            onkeypress="if(event.key==='Enter'){event.preventDefault();addManualAnnotation();}">
                    </div>
                    <button class="btn" onclick="addManualAnnotation()" style="width: 100%; font-size: 12px;">添加批注（或按回车）</button>
                </div>
            `;
            
            // 显示提示
            video.style.display = 'none';
            document.getElementById('uploadHint').innerHTML = `
                <div style="text-align: center; padding: 40px;">
                    <div style="font-size: 24px; margin-bottom: 16px;">📁</div>
                    <p style="font-size: 14px; color: var(--text-secondary); margin-bottom: 12px;">微盘视频批注模式已启用</p>
                    <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 16px;">在右侧点击「在微盘观看视频」按钮</p>
                    <p style="font-size: 12px; color: var(--text-muted);">观看后手动输入时间点和批注</p>
                </div>
            `;
            document.getElementById('uploadHint').style.display = 'flex';
        }
        
        // 处理微盘加载失败
        function handleWeDriveError() {
            alert('⚠️ 微盘预览加载失败\n\n可能原因：\n• 微盘需要登录\n• 浏览器安全限制\n\n解决方案：\n• 点击「新窗口打开」在独立窗口观看\n• 或下载视频后本地上传');
        }
        
        // 手动添加批注
        function addManualAnnotation() {
            const timeStr = document.getElementById('manualTimeInput').value.trim();
            const content = document.getElementById('manualContentInput').value.trim();
            
            if (!timeStr) {
                alert('请输入时间点（格式：01:23:12）');
                document.getElementById('manualTimeInput').focus();
                return;
            }
            
            // 解析时间（分:秒:帧）
            const timeParts = timeStr.split(':').map(Number);
            let seconds = 0;
            
            if (timeParts.length === 3) {
                // 分:秒:帧
                seconds = timeParts[0] * 60 + timeParts[1] + timeParts[2] / 25;
            } else if (timeParts.length === 2) {
                // 分:秒
                seconds = timeParts[0] * 60 + timeParts[1];
            } else {
                alert('时间格式错误，请使用：\n• 01:23:12（分:秒:帧）\n• 01:23（分:秒）');
                document.getElementById('manualTimeInput').focus();
                return;
            }
            
            if (isNaN(seconds) || seconds < 0) {
                alert('时间格式错误');
                document.getElementById('manualTimeInput').focus();
                return;
            }
            
            // 添加批注
            const annotation = {
                id: Date.now(),
                time: seconds,
                content: content || ''
            };
            
            annotations.push(annotation);
            annotations.sort((a, b) => a.time - b.time);
            
            // 清空输入并聚焦到时间输入框，方便继续添加
            document.getElementById('manualTimeInput').value = '';
            document.getElementById('manualContentInput').value = '';
            document.getElementById('manualTimeInput').focus();
            
            renderAnnotations();
        }
        
        // 加载视频
        function loadVideo(url) {
            video.src = url;
            video.style.display = 'block';
            document.getElementById('uploadHint').style.display = 'none';
            
            video.onerror = function() {
                alert('❌ 视频加载失败：\n\n可能的原因：\n1. 链接不是有效的视频文件\n2. 视频格式不支持\n3. 需要登录才能访问');
                document.getElementById('statusHint').innerHTML = '❌ 加载失败';
                document.getElementById('statusHint').style.color = 'var(--warning)';
            };
            
            video.onloadeddata = function() {
                if (url.startsWith('http')) {
                    document.getElementById('statusHint').innerHTML = '✅ 在线视频，可分享';
                    document.getElementById('statusHint').style.color = 'var(--accent)';
                }
            };
        }

        // 加载本地文件
        // 加载多个本地文件
        async function loadLocalFiles(event) {
            const files = Array.from(event.target.files);
            if (files.length === 0) return;
            
            // 按文件名排序（识别集数）
            files.sort((a, b) => {
                const numA = parseInt(a.name.match(/\d+/) || [0]);
                const numB = parseInt(b.name.match(/\d+/) || [0]);
                return numA - numB;
            });
            
            // 清空之前的视频
            videos = [];
            totalDuration = 0;
            
            // 加载每个视频
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const url = URL.createObjectURL(file);
                
                // 创建临时视频元素获取时长
                const tempVideo = document.createElement('video');
                tempVideo.src = url;
                
                await new Promise(resolve => {
                    tempVideo.onloadedmetadata = () => {
                        videos.push({
                            file: file,
                            name: file.name.replace(/\.[^/.]+$/, ""),
                            url: url,
                            duration: tempVideo.duration,
                            startTime: totalDuration
                        });
                        totalDuration += tempVideo.duration;
                        resolve();
                    };
                    tempVideo.onerror = resolve;
                    setTimeout(resolve, 3000);
                });
            }
            
            if (videos.length > 0) {
                loadVideoByIndex(0);
                updateMultiVideoTimeline();
                document.getElementById('addVideoBtn').style.display = 'inline-block';
                document.getElementById('statusHint').innerHTML = `📁 ${videos.length} 个视频`;
                document.getElementById('statusHint').style.color = 'var(--accent)';
            }
        }
        
        // 添加更多视频
        async function addMoreVideos(event) {
            const files = Array.from(event.target.files);
            if (files.length === 0) return;
            
            files.sort((a, b) => {
                const numA = parseInt(a.name.match(/\d+/) || [0]);
                const numB = parseInt(b.name.match(/\d+/) || [0]);
                return numA - numB;
            });
            
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const url = URL.createObjectURL(file);
                
                const tempVideo = document.createElement('video');
                tempVideo.src = url;
                
                await new Promise(resolve => {
                    tempVideo.onloadedmetadata = () => {
                        videos.push({
                            file: file,
                            name: file.name.replace(/\.[^/.]+$/, ""),
                            url: url,
                            duration: tempVideo.duration,
                            startTime: totalDuration
                        });
                        totalDuration += tempVideo.duration;
                        resolve();
                    };
                    tempVideo.onerror = resolve;
                    setTimeout(resolve, 3000);
                });
            }
            
            updateMultiVideoTimeline();
            document.getElementById('statusHint').innerHTML = `📁 ${videos.length} 个视频`;
        }
        
        // 加载指定索引的视频
        function loadVideoByIndex(index) {
            if (index < 0 || index >= videos.length) return;
            
            currentVideoIndex = index;
            const videoData = videos[index];
            
            video.src = videoData.url;
            video.style.display = 'block';
            document.getElementById('uploadHint').style.display = 'none';
            document.getElementById('videoUrlInput').value = videoData.name;
        }
        
        // 更新多视频时间轴
        function updateMultiVideoTimeline() {
            const timelineContainer = document.getElementById('timeline');
            
            // 如果有多个视频，显示分段标记
            if (videos.length > 1) {
                let segmentsHTML = '';
                videos.forEach((v, i) => {
                    const leftPercent = (v.startTime / totalDuration) * 100;
                    const widthPercent = (v.duration / totalDuration) * 100;
                    
                    segmentsHTML += `
                        <div style="position: absolute; left: ${leftPercent}%; width: ${widthPercent}%; 
                            height: 100%; background: ${i % 2 === 0 ? 'rgba(0, 212, 170, 0.1)' : 'rgba(255, 107, 107, 0.1)'};
                            border-right: 1px solid var(--border);">
                            <div style="position: absolute; top: 0; left: 4px; font-size: 10px; color: var(--text-muted);">
                                ${v.name.substring(0, 8)}
                            </div>
                        </div>
                    `;
                });
                
                timelineContainer.innerHTML = segmentsHTML + 
                    '<div class="timeline-progress" id="timelineProgress"></div>' +
                    '<div class="timeline-playhead" id="playhead"></div>' +
                    '<div class="timeline-preview-head" id="previewHead"></div>' +
                    '<div class="timeline-preview-time" id="previewTime">00:00:00</div>' +
                    '<div class="timeline-markers" id="timelineMarkers"></div>';
            }
            
            // 更新总时长显示（显示总时长）
            document.getElementById('totalTime').textContent = formatTime(totalDuration);
        }
        
        // 旧的loadLocalFile改为单文件兼容
        function loadLocalFile(event) {
            const file = event.target.files[0];
            if (file) {
                handleVideoUpload(file);
            }
        }

        // 从URL加载批注数据
        function loadAnnotationsFromUrl() {
            const params = new URLSearchParams(window.location.search);
            const data = params.get('data');
            
            if (data) {
                try {
                    const decoded = JSON.parse(atob(data));
                    annotations = decoded.annotations || [];
                    
                    if (decoded.videoUrl) {
                        document.getElementById('videoUrlInput').value = decoded.videoUrl;
                    }
                    
                    // 如果是微盘链接
                    if (decoded.weDriveUrl) {
                        window.currentWeDriveUrl = decoded.weDriveUrl;
                        enableWeDriveViewMode(decoded.weDriveUrl);
                    } else if (decoded.videoUrl && decoded.videoUrl.startsWith('http')) {
                        // 在线视频链接
                        video.src = decoded.videoUrl;
                        video.style.display = 'block';
                        document.getElementById('uploadHint').style.display = 'none';
                        document.getElementById('statusHint').innerHTML = '✅ 在线视频';
                        document.getElementById('statusHint').style.color = 'var(--accent)';
                    }
                    
                    renderAnnotations();
                    
                    // 显示提示
                    if (annotations.length > 0) {
                        setTimeout(() => {
                            alert(`📥 已加载 ${annotations.length} 条批注\n\n${decoded.weDriveUrl ? '📁 这是微盘视频批注\n点击右侧「在微盘观看视频」按钮' : '可以点击批注跳转到对应时间点'}`);
                        }, 500);
                    }
                    
                } catch (e) {
                    console.error('Failed to load annotations from URL:', e);
                }
            }
        }
        
        // 微盘查看模式（剪辑师打开分享链接）
        function enableWeDriveViewMode(wedriveUrl) {
            document.getElementById('statusHint').innerHTML = '📁 微盘视频批注';
            document.getElementById('statusHint').style.color = 'var(--accent)';
            
            document.getElementById('uploadHint').innerHTML = `
                <div style="text-align: center; padding: 40px;">
                    <div style="font-size: 24px; margin-bottom: 16px;">📁</div>
                    <p style="font-size: 14px; color: var(--text-secondary); margin-bottom: 12px;">微盘视频批注分享</p>
                    <p style="font-size: 12px; color: var(--text-muted);">右侧有批注列表，点击时间点在微盘跳转</p>
                </div>
            `;
            document.getElementById('uploadHint').style.display = 'flex';
            
            // 显示微盘观看按钮
            document.getElementById('manualAddSection').style.display = 'block';
            document.getElementById('manualAddSection').innerHTML = `
                <div style="padding: 12px; background: var(--bg-tertiary); border-bottom: 1px solid var(--border);">
                    <a href="${wedriveUrl}" target="_blank" class="btn btn-primary" style="width: 100%; font-size: 12px; text-align: center;">
                        🔗 在微盘观看视频
                    </a>
                </div>
            `;
        }

        // 双击上传视频
        function handleDoubleClickUpload() {
            if (video.style.display === 'none') {
                document.getElementById('fileInput').click();
            }
        }
        
        // 设置拖拽上传
        function setupDragAndDrop() {
            const wrapper = document.getElementById('videoWrapper');
            
            wrapper.addEventListener('dragover', (e) => {
                e.preventDefault();
                wrapper.style.borderColor = 'var(--accent)';
                wrapper.style.background = 'rgba(0, 212, 170, 0.05)';
            });
            
            wrapper.addEventListener('dragleave', (e) => {
                e.preventDefault();
                wrapper.style.borderColor = '';
                wrapper.style.background = '';
            });
            
            wrapper.addEventListener('drop', (e) => {
                e.preventDefault();
                wrapper.style.borderColor = '';
                wrapper.style.background = '';
                
                const files = e.dataTransfer.files;
                if (files.length > 0 && files[0].type.startsWith('video/')) {
                    handleVideoUpload(files[0]);
                }
            });
        }
        
        // 处理视频上传
        function handleVideoUpload(file) {
            const url = URL.createObjectURL(file);
            video.src = url;
            video.style.display = 'block';
            document.getElementById('uploadHint').style.display = 'none';
            document.getElementById('videoUrlInput').value = file.name;
            
            // 显示状态提示
            document.getElementById('statusHint').innerHTML = '⚠️ 本地文件不可分享 | <a href="#" onclick="showUploadGuide()" style="color: var(--accent);">如何获取在线链接？</a>';
        }
        
        // 显示上传引导
        function showUploadGuide() {
            alert('📤 如何获取可分享的视频链接：\n\n方案一：企业微信微盘（推荐）\n1. 打开企业微信 → 微盘\n2. 上传视频文件\n3. 右键视频 → 分享 → 复制链接\n4. 粘贴到顶部输入框加载\n\n方案二：腾讯视频\n1. 登录腾讯视频\n2. 上传视频\n3. 获取视频链接\n4. 粘贴到顶部输入框加载\n\n方案三：阿里云OSS/七牛云等\n1. 上传视频到云存储\n2. 获取视频的URL\n3. 粘贴到顶部输入框加载\n\n提示：获取在线链接后，重新添加批注即可分享给同事！');
        }

        // 播放控制
        function togglePlay() {
            if (video.paused) {
                video.play();
            } else {
                video.pause();
            }
        }

        // 跳转
        function skip(seconds) {
            video.currentTime += seconds;
        }
        
        // 切换逐帧模式
        function toggleFrameMode() {
            frameMode = !frameMode;
            const btn = document.getElementById('frameBtn');
            
            if (frameMode) {
                btn.style.background = 'var(--accent)';
                btn.style.color = 'var(--bg-primary)';
                btn.style.borderColor = 'var(--accent)';
                
                // 逐帧慢放：每秒播放5帧（每200毫秒前进1帧）
                video.play();
                video.playbackRate = 0.2; // 速度设为0.2倍（约每秒5帧）
            } else {
                btn.style.background = 'var(--bg-tertiary)';
                btn.style.color = 'var(--text-primary)';
                btn.style.borderColor = 'var(--border)';
                
                // 恢复正常速度
                video.playbackRate = currentSpeed;
            }
        }

        // 设置播放速度
        function setSpeed(speed) {
            currentSpeed = speed;
            
            // 如果不在逐帧模式，才改变播放速度
            if (!frameMode) {
                video.playbackRate = speed;
            }
            
            document.querySelectorAll('.speed-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }

        // 格式化时间 (分:秒:帧)
        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            const frames = Math.floor((seconds * 25) % 25); // 假设25fps
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}:${frames.toString().padStart(2, '0')}`;
        }

        // 右键菜单相关函数
        let contextMenuVisible = false;

        function showTimelineContextMenu(event) {
            event.preventDefault();
            
            if (videos.length === 0) {
                return; // 没有视频时不显示菜单
            }
            
            const menu = document.getElementById('contextMenu');
            menu.style.display = 'block';
            menu.style.left = event.clientX + 'px';
            menu.style.top = event.clientY + 'px';
            contextMenuVisible = true;
        }

        function hideContextMenu() {
            const menu = document.getElementById('contextMenu');
            menu.style.display = 'none';
            contextMenuVisible = false;
        }

        function exportCurrentEpisodeImage() {
            hideContextMenu();
            
            if (videos.length === 0) {
                alert('没有视频可导出');
                return;
            }
            
            const v = videos[currentVideoIndex];
            const list = annotations[v.name] || [];
            
            if (list.length === 0) {
                alert('当前视频没有批注');
                return;
            }
            
            exportAsImage();
        }

        function deleteCurrentEpisode() {
            hideContextMenu();
            
            if (videos.length === 0) {
                alert('没有视频可删除');
                return;
            }
            
            const videoName = videos[currentVideoIndex].name;
            
            // 删除该视频的所有批注
            annotations = annotations.filter(a => a.videoName !== videoName);
            
            // 删除视频
            videos.splice(currentVideoIndex, 1);
            
            // 更新时间
            if (videos.length > 0) {
                totalDuration = 0;
                videos.forEach((v, i) => {
                    v.startTime = totalDuration;
                    totalDuration += v.duration;
                });
                
                currentVideoIndex = Math.min(currentVideoIndex, videos.length - 1);
                loadVideo(currentVideoIndex);
                renderAnnotations();
            } else {
                // 没有视频了
                videos = [];
                currentVideoIndex = 0;
                totalDuration = 0;
                video.src = '';
                video.style.display = 'none';
                document.getElementById('uploadHint').style.display = 'flex';
                renderAnnotations();
            }
            
            updateEpisodeList();
        }

        // 点击其他地方隐藏菜单
        document.addEventListener('click', function(e) {
            if (contextMenuVisible && !e.target.closest('.context-menu')) {
                hideContextMenu();
            }
        });

        // 更新时间轴
        function updateTimeline() {
            let progress = 0;
            let currentTimeDisplay = 0;
            
            // 多视频模式
            if (videos.length > 0) {
                const currentVideo = videos[currentVideoIndex];
                // 播放头位置：全局时间
                const globalTime = currentVideo.startTime + video.currentTime;
                progress = (globalTime / totalDuration) * 100;
                
                // 显示当前视频的本地时间
                currentTimeDisplay = video.currentTime;
            } else {
                // 单视频模式
                progress = (video.currentTime / video.duration) * 100;
                currentTimeDisplay = video.currentTime;
            }
            
            document.getElementById('timelineProgress').style.width = progress + '%';
            document.getElementById('playhead').style.left = progress + '%';
            document.getElementById('currentTime').textContent = formatTime(currentTimeDisplay);
            
            // 高亮当前批注
            highlightCurrentAnnotation();
        }

        // 高亮当前批注
        function highlightCurrentAnnotation() {
            const currentTime = video.currentTime;
            
            document.querySelectorAll('.annotation-item').forEach((item, index) => {
                const annotation = annotations[index];
                if (annotation) {
                    const isActive = currentTime >= annotation.time && currentTime < annotation.time + 2;
                    item.classList.toggle('active', isActive);
                }
            });
        }

        // 点击时间轴跳转
        // 点击时间轴跳转
        function seekVideo(event) {
            const rect = event.currentTarget.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const percentage = x / rect.width;
            
            if (videos.length > 0) {
                // 多视频模式：计算全局时间并找到对应的视频
                const globalTime = percentage * totalDuration;
                
                // 找到对应的视频
                let targetVideoIndex = 0;
                for (let i = 0; i < videos.length; i++) {
                    if (globalTime >= videos[i].startTime && 
                        (i === videos.length - 1 || globalTime < videos[i + 1].startTime)) {
                        targetVideoIndex = i;
                        break;
                    }
                }
                
                // 切换到目标视频
                const targetVideo = videos[targetVideoIndex];
                const localTime = globalTime - targetVideo.startTime;
                
                loadVideoByIndex(targetVideoIndex);
                video.currentTime = localTime;
                
                // 立即更新播放头位置
                const playheadPercent = (globalTime / totalDuration) * 100;
                document.getElementById('playhead').style.left = playheadPercent + '%';
                document.getElementById('timelineProgress').style.width = playheadPercent + '%';
            } else {
                // 单视频模式
                video.currentTime = percentage * video.duration;
                
                // 立即更新播放头位置
                document.getElementById('playhead').style.left = (percentage * 100) + '%';
                document.getElementById('timelineProgress').style.width = (percentage * 100) + '%';
            }
        }

        // 在当前位置添加标签
        function addMarkerAtCurrentTime() {
            addMarker(video.currentTime);
        }

        // 在点击位置添加标签
        function addMarkerAtPosition(event) {
            const rect = event.currentTarget.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const percentage = x / rect.width;
            const time = percentage * video.duration;
            addMarker(time);
        }

        // 添加标签
        function addMarker(time) {
            if (!video.duration && videos.length === 0) {
                alert('请先加载视频');
                return;
            }
            
            // 暂停视频
            video.pause();
            
            // 计算全局时间（多视频模式下）
            let globalTime = time;
            let videoName = '';
            
            if (videos.length > 0) {
                // 找到当前视频并计算全局时间
                const currentVideo = videos[currentVideoIndex];
                globalTime = currentVideo.startTime + time;
                videoName = currentVideo.name;
            } else {
                videoName = document.getElementById('videoUrlInput').value || '视频';
            }
            
            const annotation = {
                id: Date.now(),
                time: globalTime,
                videoName: videoName,
                localTime: time, // 在该视频内的本地时间
                videoIndex: currentVideoIndex,
                content: ''
            };
            
            annotations.push(annotation);
            annotations.sort((a, b) => a.time - b.time);
            
            renderAnnotations();
            
            // 自动开始编辑
            editAnnotation(annotation.id);
        }

        // 渲染批注列表
        function renderAnnotations() {
            const list = document.getElementById('annotationsList');
            const markers = document.getElementById('timelineMarkers');
            
            // 更新时间轴标签
            let markersHTML = '';
            annotations.forEach(a => {
                let position = 0;
                
                if (videos.length > 0) {
                    // 多视频模式：使用全局时间计算位置
                    position = (a.time / totalDuration) * 100;
                    
                    // 但提示框显示本地时间
                    markersHTML += `
                        <div class="marker" style="left: ${position}%" 
                             onclick="jumpToAnnotation(${a.id})" data-id="${a.id}">
                            <div class="timeline-tooltip">
                                <div class="marker-tooltip-title">${formatTime(a.localTime)}</div>
                                <div class="marker-tooltip-preview">${a.content || '未填写批注'}</div>
                            </div>
                        </div>
                    `;
                } else if (video.duration) {
                    // 单视频模式
                    position = (a.time / video.duration) * 100;
                    
                    markersHTML += `
                        <div class="marker" style="left: ${position}%" 
                             onclick="jumpToAnnotation(${a.id})" data-id="${a.id}">
                            <div class="timeline-tooltip">
                                <div class="marker-tooltip-title">${formatTime(a.time)}</div>
                                <div class="marker-tooltip-preview">${a.content || '未填写批注'}</div>
                            </div>
                        </div>
                    `;
                }
            });
            
            markers.innerHTML = markersHTML;
            
            // 更新批注列表
            if (annotations.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📝</div>
                        <p>还没有批注<br>双击时间轴或按 M 添加标签</p>
                    </div>
                `;
            } else {
                // 显示所有批注，但时间显示本地时间
                list.innerHTML = annotations.map(a => {
                    // 显示本地时间
                    const timeDisplay = videos.length > 0 ? formatTime(a.localTime) : formatTime(a.time);
                    // 显示集数名称（多视频模式）
                    const episodeName = videos.length > 0 ? `<span style="color: var(--accent); font-size: 12px;">${a.videoName}</span>` : '';
                    
                    return `
                        <div class="annotation-item" id="annotation-${a.id}" onclick="jumpToAnnotation(${a.id})">
                            <div class="annotation-header">
                                <div class="annotation-time">${timeDisplay} ${episodeName}</div>
                                <div class="annotation-actions">
                                    <button class="annotation-action" onclick="event.stopPropagation(); editAnnotation(${a.id})" title="编辑">✏️</button>
                                    <button class="annotation-action delete" onclick="event.stopPropagation(); deleteAnnotation(${a.id})" title="删除">🗑️</button>
                                </div>
                            </div>
                            <div class="annotation-content" id="content-${a.id}">${a.content || '<span style="color: var(--text-muted)">点击编辑批注...</span>'}</div>
                        </div>
                    `;
                }).join('');
            }
            
            // 更新计数
            document.getElementById('markerCount').textContent = `${annotations.length} 个标签`;
        }

        // 跳转到批注
        function jumpToAnnotation(id) {
            const annotation = annotations.find(a => a.id === id);
            if (!annotation) return;
            
            // 如果是微盘模式，提示用户手动跳转
            if (window.currentWeDriveUrl) {
                alert(`⏱️ 批注时间点：${formatTime(annotation.time)}\n\n请在微盘中手动跳转到此时间点。\n\n批注内容：${annotation.content || '（未填写）'}`);
                return;
            }
            
            // 多视频模式
            if (videos.length > 0 && annotation.videoIndex !== undefined) {
                // 切换到对应的视频
                loadVideoByIndex(annotation.videoIndex);
                
                // 跳转到本地时间
                setTimeout(() => {
                    video.currentTime = annotation.localTime || annotation.time;
                    video.play();
                }, 100);
            } else if (video.style.display !== 'none') {
                // 单视频模式
                video.currentTime = annotation.time;
                video.play();
            }
            
            // 高亮标签
            document.querySelectorAll('.marker').forEach(m => m.classList.remove('active'));
            const marker = document.querySelector(`.marker[data-id="${id}"]`);
            if (marker) marker.classList.add('active');
            
            // 滚动到批注项
            const item = document.getElementById(`annotation-${id}`);
            if (item) {
                item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        // 编辑批注
        function editAnnotation(id) {
            const annotation = annotations.find(a => a.id === id);
            if (!annotation) return;
            
            editingId = id;
            const contentEl = document.getElementById(`content-${id}`);
            const content = annotation.content || '';
            
            contentEl.innerHTML = `<textarea class="annotation-content editing" onblur="saveAnnotation(${id})" onkeydown="handleEditKeydown(event, ${id})">${content}</textarea>`;
            contentEl.querySelector('textarea').focus();
        }

        // 保存批注
        function saveAnnotation(id) {
            const textarea = document.querySelector(`#content-${id} textarea`);
            if (textarea) {
                const annotation = annotations.find(a => a.id === id);
                if (annotation) {
                    annotation.content = textarea.value;
                }
            }
            editingId = null;
            renderAnnotations();
        }

        // 删除批注
        function deleteAnnotation(id) {
            annotations = annotations.filter(a => a.id !== id);
            renderAnnotations();
        }

        // 键盘快捷键
        function handleKeyboard(event) {
            // 如果正在编辑，不处理快捷键
            if (editingId !== null && event.target.tagName === 'TEXTAREA') {
                return;
            }
            
            switch(event.code) {
                case 'Space':
                    event.preventDefault();
                    togglePlay();
                    break;
                case 'ArrowLeft':
                    event.preventDefault();
                    skip(-5);
                    break;
                case 'ArrowRight':
                    event.preventDefault();
                    skip(5);
                    break;
                case 'KeyM':
                    event.preventDefault();
                    addMarkerAtCurrentTime();
                    break;
                case 'KeyF':
                    event.preventDefault();
                    toggleFrameMode();
                    break;
            }
        }

        // 编辑时的键盘处理
        function handleEditKeydown(event, id) {
            if (event.code === 'Escape') {
                event.preventDefault();
                saveAnnotation(id);
            } else if (event.code === 'Enter' && !event.shiftKey) {
                // 回车键保存并继续播放（Shift+回车换行）
                event.preventDefault();
                saveAnnotationAndContinue(id);
            }
        }
        
        // 保存批注并继续播放
        function saveAnnotationAndContinue(id) {
            saveAnnotation(id);
            
            // 如果批注内容为空，从列表中删除
            const annotation = annotations.find(a => a.id === id);
            if (annotation && !annotation.content.trim()) {
                annotations = annotations.filter(a => a.id !== id);
                renderAnnotations();
            }
            
            // 如果是本地视频，自动播放
            if (video.style.display !== 'none' && !window.currentWeDriveUrl) {
                video.play();
            }
            
            // 聚焦到视频区域
            video.focus();
        }

        // 分享批注
        function shareAnnotations() {
            if (annotations.length === 0) {
                alert('⚠️ 请先添加批注');
                return;
            }
            
            const videoUrl = document.getElementById('videoUrlInput').value.trim();
            const weDriveUrl = window.currentWeDriveUrl;
            
            const data = {
                videoUrl: videoUrl,
                weDriveUrl: weDriveUrl,
                annotations: annotations.map(a => ({
                    time: a.time,
                    content: a.content
                }))
            };
            
            const encoded = btoa(JSON.stringify(data));
            const shareUrl = `${window.location.origin}${window.location.pathname}?data=${encoded}`;
            
            document.getElementById('shareUrl').textContent = shareUrl;
            document.getElementById('shareModal').classList.add('active');
        }

        // 复制分享链接
        function copyShareUrl() {
            const url = document.getElementById('shareUrl').textContent;
            navigator.clipboard.writeText(url).then(() => {
                alert('链接已复制到剪贴板！');
            }).catch(err => {
                console.error('Failed to copy:', err);
            });
        }

        // 关闭分享模态框
        function closeShareModal() {
            document.getElementById('shareModal').classList.remove('active');
        }
        
        // 导出批注
        function exportAnnotations() {
            if (annotations.length === 0) {
                alert('⚠️ 还没有批注可以导出\n\n请先添加批注');
                return;
            }
            
            // 显示导出选项
            showExportOptions();
        }
        
        // 导出文本
        function exportAsText() {
            document.getElementById('exportMenu').style.display = 'none';
            
            if (annotations.length === 0) return;
            
            const videoName = videos.length > 0 ? `${videos[0].name} 等${videos.length}个视频` : (document.getElementById('videoUrlInput').value || '视频');
            
            let markdown = `# 🎬 批注列表\n\n`;
            markdown += `审片时间：${new Date().toLocaleString('zh-CN')}\n\n`;
            
            if (videos.length > 0) {
                markdown += `共 ${videos.length} 个视频，${annotations.length} 条批注\n\n`;
            } else {
                markdown += `共 ${annotations.length} 条批注\n\n`;
            }
            
            markdown += `---\n\n`;
            
            // 按视频分组
            if (videos.length > 0) {
                const grouped = {};
                annotations.forEach(a => {
                    const key = a.videoName || '未知';
                    if (!grouped[key]) grouped[key] = [];
                    grouped[key].push(a);
                });
                
                Object.keys(grouped).sort((a, b) => {
                    const numA = parseInt(a.match(/\d+/) || [0]);
                    const numB = parseInt(b.match(/\d+/) || [0]);
                    return numA - numB;
                }).forEach((videoName, videoIndex) => {
                    const batch = grouped[videoName];
                    
                    // 视频标题
                    markdown += `## ${videoName}\n\n`;
                    markdown += `${batch.length} 条批注\n\n`;
                    
                    // 批注列表
                    batch.forEach((a, index) => {
                        const timeDisplay = formatTime(a.localTime);
                        const content = a.content || '（未填写批注）';
                        
                        markdown += `${timeDisplay}  ${content}\n\n`;
                    });
                    
                    // 视频之间的分隔线
                    if (videoIndex < Object.keys(grouped).length - 1) {
                        markdown += `---\n\n`;
                    }
                });
            } else {
                // 单视频模式
                annotations.forEach((a, index) => {
                    const timeStr = formatTime(a.time);
                    const content = a.content || '（未填写批注）';
                    
                    markdown += `${timeStr}  ${content}\n\n`;
                });
            }
            
            const blob = new Blob([markdown], { type: 'text/markdown;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `批注列表.md`;
            a.click();
            URL.revokeObjectURL(url);
            
            navigator.clipboard.writeText(markdown);
        }
        
        // 导出长图（带视频截图）
        async function exportAsImage() {
            document.getElementById('exportMenu').style.display = 'none';
            
            if (annotations.length === 0) return;
            if (videos.length === 0 && (!video.src || video.style.display === 'none')) return;
            
            const currentTime = video.currentTime;
            const currentVideo = currentVideoIndex;
            
            try {
                // 多视频模式：按每集单独导出
                if (videos.length > 0) {
                    const grouped = {};
                    annotations.forEach(a => {
                        const key = a.videoName || '未知';
                        if (!grouped[key]) grouped[key] = [];
                        grouped[key].push(a);
                    });
                    
                    const videoNames = Object.keys(grouped).sort((a, b) => {
                        const numA = parseInt(a.match(/\d+/) || [0]);
                        const numB = parseInt(b.match(/\d+/) || [0]);
                        return numA - numB;
                    });
                    
                    for (let vName of videoNames) {
                        const videoAnnotations = grouped[vName];
                        await exportVideoImage(vName, videoAnnotations);
                    }
                } else {
                    await exportSingleVideoImage();
                }
            } catch (error) {
                console.error('导出失败:', error);
            }
            
            // 恢复播放位置
            if (videos.length > 0) {
                loadVideoByIndex(currentVideo);
            }
            video.currentTime = currentTime;
        }
        
        // 导出单个视频的图片
        async function exportVideoImage(videoName, videoAnnotations) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            const width = 800;
            const padding = 40;
            
            // 切换到该视频
            const firstAnnotation = videoAnnotations[0];
            if (firstAnnotation.videoIndex !== undefined) {
                loadVideoByIndex(firstAnnotation.videoIndex);
            }
            
            // 等待视频加载
            await new Promise(resolve => {
                const checkReady = () => {
                    if (video.readyState >= 2) {
                        resolve();
                    } else {
                        setTimeout(checkReady, 100);
                    }
                };
                checkReady();
                video.onloadeddata = resolve;
                setTimeout(resolve, 3000);
            });
            
            // 计算截图高度
            const videoWidth = video.videoWidth || 1920;
            const videoHeight = video.videoHeight || 1080;
            const aspectRatio = videoHeight / videoWidth;
            
            // 计算总高度（预估）
            let height = 120; // 标题区域
            videoAnnotations.forEach((a) => {
                height += Math.round(width * aspectRatio) + 40; // 截图+间距
                height += 60; // 时间
                // 预估文字行数（保守估计每行15个字）
                const content = a.content || '（未填写批注）';
                const lines = Math.ceil(content.length / 15);
                height += 60 * lines + 60; // 文字高度+批注间距
            });
            height += 120; // 底部留白
            
            canvas.width = width;
            canvas.height = height;
            
            // 白色背景
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, width, height);
            
            // 标题
            ctx.fillStyle = '#000000';
            ctx.font = 'bold 64px -apple-system, sans-serif';
            ctx.fillText(videoName, padding, 70);
            
            let y = 150;
            
            // 遍历批注
            for (let a of videoAnnotations) {
                // 跳转到批注时间点
                video.currentTime = a.localTime || a.time;
                
                await new Promise(resolve => {
                    const checkReady = () => {
                        if (video.readyState >= 2) {
                            resolve();
                        } else {
                            setTimeout(checkReady, 100);
                        }
                    };
                    checkReady();
                    video.onseeked = resolve;
                    setTimeout(resolve, 1000);
                });
                
                // 截图高度
                const screenshotHeight = Math.round(width * aspectRatio);
                
                // 绘制截图
                ctx.drawImage(video, 0, y, width, screenshotHeight);
                
                y += screenshotHeight + 40; // 增加图片和文字间距
                
                // 时间（蓝色，与批注相同大小）- 显示本地时间
                ctx.fillStyle = '#0066CC';
                ctx.font = 'bold 48px -apple-system, sans-serif';
                ctx.fillText(formatTime(a.localTime || a.time), padding, y);
                
                y += 60;
                
                // 批注内容（黑色，与时间相同大小）
                ctx.fillStyle = '#000000';
                ctx.font = '48px -apple-system, sans-serif';
                const content = a.content || '（未填写批注）';
                const maxWidth = width - padding * 2;
                
                const words = content.split('');
                let line = '';
                let lineY = y;
                
                for (let word of words) {
                    const testLine = line + word;
                    const metrics = ctx.measureText(testLine);
                    if (metrics.width > maxWidth) {
                        ctx.fillText(line, padding, lineY);
                        line = word;
                        lineY += 60;
                    } else {
                        line = testLine;
                    }
                }
                ctx.fillText(line, padding, lineY);
                
                y = lineY + 60; // 增加批注之间的间距
            }
            
            // 底部强制添加白色留白区域
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, y, width, 120);
            
            // 下载图片
            const link = document.createElement('a');
            link.download = `${videoName}_批注.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
        
        // 导出单视频图片
        async function exportSingleVideoImage() {
            const videoName = document.getElementById('videoUrlInput').value || '视频';
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            const width = 800;
            const padding = 40;
            
            const videoWidth = video.videoWidth || 1920;
            const videoHeight = video.videoHeight || 1080;
            const aspectRatio = videoHeight / videoWidth;
            
            // 计算总高度（预估）
            let height = 120; // 标题区域
            annotations.forEach((a) => {
                height += Math.round(width * aspectRatio) + 40; // 截图+间距
                height += 60; // 时间
                // 预估文字行数
                const content = a.content || '（未填写批注）';
                const lines = Math.ceil(content.length / 15);
                height += 60 * lines + 60; // 文字高度+批注间距
            });
            height += 120; // 底部留白
            
            canvas.width = width;
            canvas.height = height;
            
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, width, height);
            
            ctx.fillStyle = '#000000';
            ctx.font = 'bold 64px -apple-system, sans-serif';
            ctx.fillText(videoName, padding, 70);
            
            let y = 150;
            
            for (let a of annotations) {
                video.currentTime = a.time;
                
                await new Promise(resolve => {
                    const checkReady = () => {
                        if (video.readyState >= 2) resolve();
                        else setTimeout(checkReady, 100);
                    };
                    checkReady();
                    video.onseeked = resolve;
                    setTimeout(resolve, 1000);
                });
                
                const screenshotHeight = Math.round(width * aspectRatio);
                ctx.drawImage(video, 0, y, width, screenshotHeight);
                
                y += screenshotHeight + 40;
                
                // 时间（蓝色）
                ctx.fillStyle = '#0066CC';
                ctx.font = 'bold 48px -apple-system, sans-serif';
                ctx.fillText(formatTime(a.time), padding, y);
                
                y += 60;
                
                // 批注（黑色）
                ctx.fillStyle = '#000000';
                ctx.font = '48px -apple-system, sans-serif';
                const content = a.content || '（未填写批注）';
                const maxWidth = width - padding * 2;
                
                const words = content.split('');
                let line = '';
                let lineY = y;
                
                for (let word of words) {
                    const testLine = line + word;
                    const metrics = ctx.measureText(testLine);
                    if (metrics.width > maxWidth) {
                        ctx.fillText(line, padding, lineY);
                        line = word;
                        lineY += 60;
                    } else {
                        line = testLine;
                    }
                }
                ctx.fillText(line, padding, lineY);
                
                y = lineY + 60;
            }
            
            // 底部强制添加白色留白区域
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, y, width, 120);
            
            const link = document.createElement('a');
            link.download = `${videoName}_批注.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
